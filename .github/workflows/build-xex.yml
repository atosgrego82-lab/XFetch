name: Build XFetch XEX prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git
      - name: Fetch open source xsdk
        run: git clone --depth 1 https://github.com/xenosworks/xsdk.git "$RUNNER_TEMP/xsdk"
      - name: Build Xbox 360 cross-toolchain
        run: |
          PREFIX="$RUNNER_TEMP/xsdk-gcc" WORK="$RUNNER_TEMP/xsdk-work" JOBS=4 bash "$RUNNER_TEMP/xsdk/tools/toolchain/build.sh"
      - name: Build xsdk
        run: |
          cd "$RUNNER_TEMP/xsdk"
          make -j4 TOOLCHAIN="$RUNNER_TEMP/xsdk-gcc/bin/powerpc-xsdk-elf-"
      - name: Prepare XFetch prototype source
        run: |
          cp "$RUNNER_TEMP/xsdk/samples/template/main.c" "$RUNNER_TEMP/main.c"
          cp "$RUNNER_TEMP/xsdk/samples/template/CMakeLists.txt" "$RUNNER_TEMP/CMakeLists.txt"
          sed -i 's/project(title C)/project(XFetch C)/; s/add_executable(title main.c)/add_executable(XFetch main.c)/; s/set_target_properties(title /set_target_properties(XFetch /; s/target_compile_options(title /target_compile_options(XFetch /; s/xsdk_add_xex(title)/xsdk_add_xex(XFetch)/' "$RUNNER_TEMP/CMakeLists.txt"
          sed -i 's/CLEAR_ARGB = 0xFF183060/CLEAR_ARGB = 0xFF103A32/' "$RUNNER_TEMP/main.c"
      - name: Compile XFetch.xex
        run: |
          cmake -S "$RUNNER_TEMP" -B "$RUNNER_TEMP/xfetch-build" -G Ninja -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/xsdk/cmake/xsdk.cmake" -DXSDK_TOOLCHAIN="$RUNNER_TEMP/xsdk-gcc" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build "$RUNNER_TEMP/xfetch-build"
          test -s "$RUNNER_TEMP/xfetch-build/XFetch.xex"
          cp "$RUNNER_TEMP/xfetch-build/XFetch.xex" XFetch.xex
      - uses: actions/upload-artifact@v4
        with:
          name: XFetch-XEX-prototype
          path: XFetch.xex
          if-no-files-found: error
